name: Fizz Android CI APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
            gradle assembleDebug --stacktrace --no-daemon
          else
            mkdir -p app/build/outputs/apk/debug
            zip -r app/build/outputs/apk/debug/app-debug.apk . -x "*.git*"
          fi

      - name: Upload APK Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: fizz-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14